services:
  db-mongo:
    container_name: db-mongo-pokedex
    image: mongo:8.0
    restart: always
    ports:
      - 27019:27017
    environment:
      MONGODB_DATABASE: nest-pokemon
    volumes:
      - mongo_nest:/data/db
  app:
    container_name: app-pokedex
    depends_on:
      - db-mongo
    build:
      context: .
      dockerfile: Dockerfile
    image: pokedex-docker
    restart: always
    ports:
      - "${PORT}:${PORT}"
    environment:
      MONGODB: ${MONGODB}
      PORT: ${PORT}
      DEFAULT_LIMIT: ${DEFAULT_LIMIT}
volumes:
  mongo_nest:
